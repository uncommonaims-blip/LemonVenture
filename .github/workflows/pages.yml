name: Test and deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test game rules
        run: npm test
      - uses: actions/configure-pages@v5
      - name: Prepare static app
        run: |
          mkdir -p _site
          cp index.html style.css _site/
          cp -r src _site/src
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          name: github-pages-${{ github.run_attempt }}
      - name: Wait for uploaded artifact metadata
        uses: actions/github-script@v7
        with:
          script: |
            const name = 'github-pages-${{ github.run_attempt }}';
            for (let attempt = 0; attempt < 8; attempt++) {
              const response = await github.rest.actions.listWorkflowRunArtifacts({
                owner: context.repo.owner, repo: context.repo.repo,
                run_id: context.runId, name, per_page: 100
              });
              const matches = response.data.artifacts.filter(a => a.name === name && !a.expired);
              if (matches.length === 1) return;
              await new Promise(resolve => setTimeout(resolve, 2000));
            }
            throw new Error('Uploaded Pages artifact metadata is not available yet. Retry this workflow.');
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
